; SSFHelper Configuration

[Settings]
; Startup delay before disc swap keys become active (ms)
StartupDelay=7000

; Protection delay after Home/End disc swap (ms)
SwapProtection=5000

; SSF R4 mode - auto F1+F2 for Home/End keys (1=ON, 0=OFF)
; ON: For SSF_012_beta_R4 (keybd_event works perfectly)
; OFF: For SSF R16+ - swap disc only, press F1+F2 manually
EnableSSF_R4_Mode=0

; === Key Mappings ===
; Values: PageDown, PageUp, Home, End, Insert, Delete,
;   OBracket ([), CBracket (]), Comma, Period, Minus,
;   Equals, Backslash, F1-F12, A-Z, 0x## hex, None

; Simple swap (no F1/F2)
Key_NextDisc=PageDown
Key_PrevDisc=PageUp

; Swap + auto F1/F2 (R4) or notify only (R16+)
Key_AutoNext=CBracket
Key_AutoPrev=OBracket

[LastDisc]
Shining Force III Collection.m3u=0
; Shining Force III Collection.m3u = 0
